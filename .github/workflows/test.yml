name: Unit tests

on: [push]

jobs:
  unit_test:
    strategy:
      matrix:
        os:
          - name: ubuntu-22.04
            extension:
            compiler: ldc-1.40.0
          - name: windows-latest
            extension: .exe
            compiler: ldc-1.40.0
          - name: macos-latest
            extension:
            compiler: ldc-1.41.0
    runs-on: ${{ matrix.os.name }}

    steps:
    - uses: actions/checkout@v4

    - uses: dlang-community/setup-dlang@v1
      name: Install LDC
      with:
        compiler: ${{ matrix.os.compiler }}

    - name: Install QuickJS-NG (Linux or MacOS)
      if: matrix.os.name != 'windows-latest'
      #todo move to separate repo
      run: |
        git clone --depth 1 https://github.com/quickjs-ng/quickjs.git /tmp/quickjs
        cd /tmp/quickjs
        cmake -B build -DBUILD_SHARED_LIBS=OFF
        cmake --build build
        sudo mkdir -p /usr/local/lib/quickjs
        sudo cp build/libqjs.a /usr/local/lib/quickjs/libquickjs.a

      #todo move to separate repo
    - name: Install QuickJS-NG (Windows)
      if: matrix.os.name == 'windows-latest'
      run: |
        git clone --depth 1 https://github.com/quickjs-ng/quickjs.git c:\quickjs
        cd c:\quickjs
        cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        mkdir C:\quickjs-lib
        echo F | xcopy build\Debug\qjs.lib C:\quickjs-lib\quickjs.lib

    - name: Build
      run: dub build

      #- name: Setup tmate session
      #uses: mxschmitt/action-tmate@v3

    - name: Unit tests
      run: dub test --coverage

    - uses: actions/cache/save@v3
      id: cache
      with:
        path: youtube-d${{ matrix.os.extension }}
        key: youtube-d-${{ matrix.os.name }}

  console_test:
    strategy:
      matrix:
        os:
          - name: ubuntu-22.04
            command: sh tests/tests.sh
            extension:
          - name: windows-latest
            command: powershell.exe -file tests\tests.ps1
            extension: .exe
          - name: macos-latest
            command: sh tests/tests-macos.sh
            extension:
    runs-on: ${{ matrix.os.name }}
    needs: unit_test
    if: false

    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache/restore@v3
      id: cache
      with:
        path: youtube-d${{ matrix.os.extension }}
        key: youtube-d-${{ matrix.os.name }}

    - name: Download libcurl.dll
      if: matrix.os.name == 'windows-latest'
      run: |
        curl -LO https://downloads.dlang.org/other/libcurl-7.68.0-WinSSL-zlib-x86-x64.zip
        tar -xf libcurl-7.68.0-WinSSL-zlib-x86-x64.zip
        xcopy dmd2\windows\bin64\libcurl.dll .

    - name: e2e tests
      run: ${{ matrix.os.command }}
