name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os:
          - name: ubuntu-22.04
            suffix: x86_64
            extension: 
            compiler: ldc-1.40.0
          - name: windows-latest
            suffix: win64
            extension: .exe
            compiler: ldc-1.40.0
          - name: macos-latest
            suffix: macos
            extension: 
            compiler: ldc-1.41.0
    runs-on: ${{ matrix.os.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dlang-community/setup-dlang@v1
        name: Install LDC
        with:
          compiler: ${{ matrix.os.compiler }}

    - name: Install QuickJS-NG (Linux or MacOS)
      if: matrix.os.name != 'windows-latest'
      #todo move to separate repo
      run: |
        git clone --depth 1 https://github.com/quickjs-ng/quickjs.git /tmp/quickjs
        cd /tmp/quickjs
        cmake -B build -DBUILD_SHARED_LIBS=OFF
        cmake --build build --config Release
        sudo mkdir -p /usr/local/lib/quickjs
        sudo cp build/libqjs.a /usr/local/lib/quickjs/libquickjs.a

      #todo move to separate repo
    - name: Install QuickJS-NG (Windows)
      if: matrix.os.name == 'windows-latest'
      run: |
        git clone --depth 1 https://github.com/quickjs-ng/quickjs.git c:\quickjs
        cd c:\quickjs
        cmake -B build -DQJS_BUILD_LIBC=ON -A x64 -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
        cmake --build build --config Release
        mkdir C:\quickjs-lib
        echo F | xcopy build\Release\qjs.lib C:\quickjs-lib\quickjs.lib

      - name: Build release
        run: dub build -b release --compiler=ldc2

      - name: Prepare assets (Windows)
        if: matrix.os.suffix == 'win64'
        run: |
          curl -LO https://downloads.dlang.org/other/libcurl-7.68.0-WinSSL-zlib-x86-x64.zip
          tar -xf libcurl-7.68.0-WinSSL-zlib-x86-x64.zip
          xcopy dmd2\windows\bin64\libcurl.dll .
          rm -r dmd2
          rm libcurl-7.68.0-WinSSL-zlib-x86-x64.zip
          tar cavf youtube-d-${{ matrix.os.suffix }}.zip youtube-d${{ matrix.os.extension }} libcurl.dll

      - name: Prepare assets (Linux or MacOS)
        if: matrix.os.suffix == 'x86_64' || matrix.os.suffix == 'macos'
        run: |
          zip youtube-d-${{ matrix.os.suffix }}.zip youtube-d${{ matrix.os.extension }}

      - name: Store build as artifact
        uses: actions/upload-artifact@v4
        with:
          path: youtube-d-${{ matrix.os.suffix }}.zip
          name: youtube-d-${{ matrix.os.suffix }}.zip

  release:
    runs-on: 'ubuntu-22.04'
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Downloads builds from previous job
        uses: actions/download-artifact@v5
        with:
          pattern: youtube-d-*.zip
          path: .
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: New release of youtube-d ${{ github.ref_name }}
          draft: true
          prerelease: false
          body_path: CHANGELOG.md
          files: |
            youtube-d-x86_64.zip
            youtube-d-win64.zip
            youtube-d-macos.zip
